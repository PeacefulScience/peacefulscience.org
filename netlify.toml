[[plugins]]
    package = "./plugins/usercache"

[functions]
directory = "functions"
node_bundler = "esbuild"
included_files = ["prince", "prince-engine/**", "contrib/**", "fonts/**", "lib/**", "etc/**"]

[build]
command = "hugo -b $URL"
publish = "public/"
NODE_VERSION = "20.15.1"

[context.production]
command = "make production"

[build.environment]
HUGO_VERSION = "0.97.3"
HUGO_ENV = "development"
AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[context.production.environment]
HUGO_ENV = "production"

[context.branch-deploy]
command = "hugo -b $DEPLOY_PRIME_URL --buildDrafts -F"

[context.deploy-preview]
command = "hugo -b $DEPLOY_PRIME_URL --buildDrafts -F"


[images]
  remote_images = [
    'https://peacefulscience\.org/img/bookcover/.*',
    'https://.*\.netlify\.app/img/bookcover/.*',
    'https://images\.amazon\.com/.*',
    'https://m\.media-amazon\.com/.*'
  ]

[[headers]]
  for = "/img/bookcover/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, s-maxage=31536000"


[dev]
command =  "make -j 10 dev"
framework = "#static"
publish = "./public/"
